<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NooXRii — Projects</title>
  <meta name="description" content="NooXRii's developer portfolio: Chrome extensions and desktop apps. / NooXRii geliştirici portföyü: Chrome eklentileri ve masaüstü uygulamaları." />
  <meta name="theme-color" content="#07070c" />
  <meta property="og:title" content="NooXRii — Projects" />
  <meta property="og:description" content="Chrome extensions and desktop apps by NooXRii." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='34' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div class="grid"></div></div>
  <div class="cursor-glow" id="glow" aria-hidden="true"></div>

  <header class="nav">
    <a class="brand" href="#top" aria-label="NooXRii"><span class="logo">N</span><span>NooXRii</span></a>
    <div class="nav-r">
      <a class="link" href="#projects" data-i18n="nav.projects">Projects</a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="tr" aria-pressed="false">TR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero wrap">
      <p class="eyebrow"><span class="pulse"></span><span data-i18n="hero.hi">Hi, I'm</span></p>
      <h1 class="name"><span class="grad">NooXRii</span></h1>
      <p class="role"><span id="typed"></span><span class="caret"></span></p>
      <div class="stats">
        <div class="stat"><b id="s-projects">0</b><span data-i18n="stat.projects">Projects</span></div>
        <div class="stat"><b id="s-tech">0</b><span data-i18n="stat.tech">Technologies</span></div>
        <div class="stat"><b id="s-live">0</b><span data-i18n="stat.live">Live</span></div>
      </div>
    </section>

    <section id="projects" class="projects wrap">
      <div class="toolbar">
        <div class="chips" id="chips"></div>
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" autocomplete="off" data-i18n-ph="search.ph" placeholder="Search projects…" />
        </label>
      </div>
      <div class="cards" id="cards"></div>
      <div class="empty" id="empty" hidden>
        <h3 data-i18n="empty.title">No projects match this search</h3>
        <p data-i18n="empty.sub">Try changing the filter or the search.</p>
      </div>
    </section>

    <div class="marquee" id="marquee" hidden aria-hidden="true"></div>
  </main>

  <footer class="wrap">
    <div class="soc" id="soc"></div>
    <p>© <span id="yr"></span> <b>NooXRii</b></p>
    <a class="top" href="#top" data-i18n="footer.top">Back to top</a>
  </footer>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="backdrop"></div>
    <div class="sheet"></div>
  </div>

  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
